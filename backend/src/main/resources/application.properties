spring.application.name=team-bsy-backend

server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/team_bsy_db?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Expense receipt storage
team-bsy.upload-dir=uploads/expense-receipts

# Chat upload limits; ExpenseFileStorageService keeps its independent 5 MB limit.
team-bsy.chat.upload-dir=${CHAT_UPLOAD_DIR:uploads/chat}
team-bsy.chat.max-file-size=${CHAT_MAX_FILE_SIZE:20971520}
team-bsy.chat.max-files-per-message=${CHAT_MAX_FILES_PER_MESSAGE:10}
spring.servlet.multipart.max-file-size=${CHAT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:210MB}